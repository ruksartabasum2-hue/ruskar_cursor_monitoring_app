<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Linux Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('main.index') }}">Linux Monitor</a>
      <nav class="nav">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
      </nav>
    </header>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">Demo monitoring — read-only views</footer>
  </body>
</html>
